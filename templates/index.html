{% extends 'base.html' %}
{% block content %}
<main>
    <section class="hero" id="profile">
        <div class="container hero-grid">
            <div class="hero-identity">
                <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                <h1>JORDAN MANAKSAK HUTAHAEAN</h1>
            </div>
            <div class="hero-photo">
                <div class="photo-block"></div>
                <img class="avatar" src="static/img/jordan.jpeg" alt="Photo of {{ name }}">
            </div>
            <div class="hero-details">
                <p class="bio">{{ bio }}</p>
                <dl class="meta-list">
                    <div class="meta-row">
                        <dt>NPM</dt>
                        <dd>{{ npm }}</dd>
                    </div>
                    <div class="meta-row">
                        <dt>Program</dt>
                        <dd>{{ study_program }}</dd>
                    </div>
                </dl>
                <div class="social-links">
                    <a href="https://github.com/Jordan-0212" class="social-link">GitHub</a>
                    <a href="https://www.linkedin.com/in/jordan-manaksak-hutahaean-82a65a380/" class="social-link">LinkedIn</a>
                    <a href="mailto:jordanmanaksak@gmail.com" class="social-link">Email</a>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock content %}
